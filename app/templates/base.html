<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sandra's FrontDoor{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    tailwind.config = { theme: { extend: {
      fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
      colors: { brand: { 50:'#f3f0ff',100:'#e9e3ff',200:'#d4c9ff',400:'#9b83ff',500:'#7c5cff',600:'#6a45f5',700:'#5634d6',900:'#2a1a6e' },
                ink: '#141824' },
      boxShadow: { card: '0 1px 2px rgba(16,24,40,.04), 0 8px 24px -8px rgba(16,24,40,.12)' }
    } } }
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <script src="{{ url_for('static', filename='js/report.js') }}"></script>
</head>
<body class="bg-[#f7f7fb] text-ink font-sans antialiased {% block bodyclass %}{% endblock %}">
  <header class="sticky top-0 z-40 bg-white/85 backdrop-blur border-b border-slate-200/70">
    <div class="max-w-[1500px] mx-auto px-4 md:px-8 h-16 flex items-center gap-8">
      <a href="/" class="flex items-center gap-2 font-extrabold text-xl tracking-tight">
        <svg viewBox="0 0 32 32" class="w-8 h-8" aria-hidden="true"><path d="M4 15 16 5l12 10v12a2 2 0 0 1-2 2h-6v-8h-8v8H6a2 2 0 0 1-2-2z" fill="#6a45f5"/><circle cx="23.5" cy="10" r="4" fill="#fff" stroke="#6a45f5" stroke-width="2"/><path d="M23.5 8.2v1.4m-1.6 1.2h3.2" stroke="#6a45f5" stroke-width="1.4" stroke-linecap="round"/></svg>
        Sandra&rsquo;s <span class="text-brand-600">FrontDoor</span>
      </a>
      <nav class="hidden md:flex items-center gap-7 text-[15px] font-medium text-slate-600">
        <a href="/" class="hover:text-ink">Buy</a><a href="/?rent=1" class="hover:text-ink">Rent</a>
        <a href="/#results" class="hover:text-ink">Explore</a>
        <a href="/" class="hover:text-ink flex items-center gap-1.5">Accessibility
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="7" r="1.3" fill="currentColor"/><path d="M7 9.5l5 1 5-1M12 10.5v3.5l-2.5 4.5M12 14l2.5 4.5"/></svg></a>
      </nav>
      <div class="ml-auto flex items-center gap-4 text-sm text-slate-600">
        <div id="report-slot"></div>
      </div>
    </div>
  </header>
  {% block body %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
